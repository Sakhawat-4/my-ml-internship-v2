<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ML Engineer Portfolio</title>
  <style>
    /* ... (your existing styles) ... */
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; margin-bottom: 0.25rem; font-weight: bold; }
    .form-group input, .form-group textarea { width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px; }
    .form-message { margin-top: 1rem; padding: 0.75rem; border-radius: 4px; display: none; }
    .form-message.success { display: block; background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .form-message.error { display: block; background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  </style>
</head>
<body>
  <!-- ... (your existing header, hero, etc.) ... -->

  <!-- === CONTACT SECTION === -->
  <section id="contact" style="padding: 4rem 2rem; max-width: 800px; margin: 0 auto;">
    <h2>Contact Me</h2>
    <p>Have a question or want to collaborate? Send me a message.</p>

    <!-- The KEY Netlify Form: Add 'netlify' and a unique 'name' -->
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field">
      <!-- Hidden input for Netlify to identify the form -->
      <input type="hidden" name="form-name" value="contact" />

      <!-- Honeypot field (hidden from real users) -->
      <p style="display:none;">
        <label>Don’t fill this out if you're human: <input name="bot-field" /></label>
      </p>

      <div class="form-group">
        <label for="name">Your Name</label>
        <input type="text" id="name" name="name" required placeholder="e.g., Jane Doe">
      </div>

      <div class="form-group">
        <label for="email">Your Email</label>
        <input type="email" id="email" name="email" required placeholder="e.g., jane@example.com">
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required placeholder="Your message here..."></textarea>
      </div>

      <button type="submit" style="background: #007bff; color: white; border: none; padding: 0.75rem 2rem; border-radius: 4px; cursor: pointer;">Send Message</button>

      <!-- This div will show success or error messages -->
      <div id="form-status" class="form-message"></div>
    </form>
  </section>

  <!-- === JAVASCRIPT FOR FORM HANDLING === -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const form = document.querySelector('form[name="contact"]');
      const statusDiv = document.getElementById('form-status');

      // Function to show a message
      function showMessage(text, type = 'success') {
        statusDiv.textContent = text;
        statusDiv.className = `form-message ${type}`;
        // Auto-hide after 5 seconds
        setTimeout(() => {
          statusDiv.className = 'form-message';
        }, 5000);
      }

      form.addEventListener('submit', function(e) {
        e.preventDefault(); // Prevent default browser submission

        // Basic validation
        const name = form.querySelector('#name').value.trim();
        const email = form.querySelector('#email').value.trim();
        const message = form.querySelector('#message').value.trim();

        if (!name || !email || !message) {
          showMessage('Please fill out all fields.', 'error');
          return;
        }

        if (!email.includes('@') || !email.includes('.')) {
          showMessage('Please enter a valid email address.', 'error');
          return;
        }

        // Prepare data for Netlify's form submission endpoint
        const formData = new FormData(form);

        // Submit data to Netlify's proxy endpoint
        fetch('/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams(formData).toString()
        })
        .then(response => {
          if (response.ok) {
            showMessage('Thanks! Your message has been sent. I\'ll be in touch soon.', 'success');
            form.reset(); // Clear the form
          } else {
            throw new Error('Network response was not ok.');
          }
        })
        .catch(error => {
          showMessage('Oops! Something went wrong. Please try again later.', 'error');
          console.error('Form submission error:', error);
        });
      });
    });
  </script>
</body>
</html>
